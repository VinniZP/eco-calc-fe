@if(hasRecipe()) {
  <button
    tp="Кликните чтобы посчитать цену"
    (click)="dialogManager.open(product()); $event.stopPropagation()"
    class="text-sm font-medium cursor-pointer transition-colors hover:underline underline-offset-2"
    [class]="static() ? 'text-warning hover:text-warning/80' : 'text-primary hover:text-primary/80'"
  >{{product()}}</button>
} @else {
  <span [class.text-warning]="static()">{{product()}}</span>
}
