<app-card class="w-full">
  <span card-title>Навыки и умения</span>
  <app-select
    [value]="selectedSkill()"
    (valueChange)="onSkillSelected($event)"
    [options]="skills()"
    searchable
    placeholder="Выберите навык"
    size="sm"
  />
  @for(skill of selectedSkills(); track skill.skill) {
    <app-skill-item [skill]="skill" />
  }
  <app-divider />
</app-card>
