<app-card class="w-full">
  <span card-title>Настройки цен</span>
  <app-select
    [value]="selectedRecipeId()"
    (valueChange)="onRecipeSelected($event)"
    [options]="recipes()"
    [trackFn]="trackById"
    [labelFn]="recipeLabel"
    searchable
    placeholder="Выберите рецепт"
    size="sm"
  />
  <app-divider />
  @for(recipe of enabledRecipes(); track recipe.id) {
    <p>{{recipe.displayName}}</p>
  }
</app-card>
