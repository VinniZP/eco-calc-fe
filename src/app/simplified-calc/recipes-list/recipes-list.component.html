<div class="px-3 py-2 flex items-center gap-3 flex-wrap border-b border-base-content/[0.04]">
  <h2 class="text-sm font-medium text-base-content/60 shrink-0">
    Рецепты
    <span class="text-base-content/30 font-normal">{{ dataSource.data().length }}</span>
  </h2>
  <div class="flex items-center gap-2 flex-1 flex-wrap">
    <div class="relative flex-1 min-w-[200px]">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-base-content/30 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input type="text" appInput size="sm" bordered placeholder="Поиск по продукту..." [value]="filtersModel().search" (input)="filtersModel.update(m => ({...m, search: $any($event.target).value}))" class="!pl-9" />
    </div>
    <app-multi-select
      class="w-full max-w-[200px]"
      [value]="filtersModel().profession"
      (valueChange)="filtersModel.update(m => ({...m, profession: $event}))"
      [options]="skills()"
      [labelFn]="stripTagsFn"
      placeholder="Профессия"
      size="sm"
    />
    <app-multi-select
      class="w-full max-w-[200px]"
      [value]="filtersModel().table"
      (valueChange)="filtersModel.update(m => ({...m, table: $event}))"
      [options]="tables()"
      placeholder="Верстак"
      size="sm"
    />
    @if (dataSource.availableSelling()) {
      <label class="flex items-center h-8 gap-2 cursor-pointer shrink-0">
        <input type="checkbox" appToggle checked="checked" [checked]="filtersModel().selling" (change)="filtersModel.update(m => ({...m, selling: $any($event.target).checked}))" />
        <span class="text-sm text-base-content/70">Только мои</span>
      </label>
    }
  </div>
</div>
<table appTable zebra size="sm">
  <thead>
    <tr>
      <th class="w-[280px]">Продукт</th>
      <th>Требования</th>
      <th class="w-10"></th>
    </tr>
  </thead>
  <tbody>
    @for (row of dataSource.paginatedData(); track row.product) {
      <tr class="cursor-pointer group" (click)="dialogManager.open(row.product)">
        <td>
          <app-product-link [product]="row.product" />
        </td>
        <td>
          <div class="flex flex-col">
            @for (recipe of row.recipes | uniqueRecipes; track recipe.id) {
              @if (!$first) {
                <span class="block border-t border-base-content/[0.05] my-0.5"></span>
              }
              <app-profession-line
                (filterByProfession)="filterByProfession($event)"
                (filterByTable)="filterByTable($event)"
                [recipe]="recipe"
              />
            }
          </div>
        </td>
        <td class="text-right !pr-4">
          <svg class="h-4 w-4 text-base-content/15 group-hover:text-primary/50 transition-colors inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </td>
      </tr>
    }
  </tbody>
</table>
<div class="py-2 flex items-center justify-center border-t border-base-content/[0.04]">
  <app-paginator
    [page]="dataSource.pagination().page"
    [pageSize]="dataSource.pagination().pageSize"
    [totalPages]="dataSource.totalPages()"
    (pageChange)="changePage($event)"
  ></app-paginator>
</div>
