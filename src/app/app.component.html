<div class="flex h-screen flex-col">
  <app-navbar>
    <a
      appButton intent="ghost" size="sm"
      routerLink="/price"
      routerLinkActive="btn-active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Калькулятор цен</a
    >
    <a appButton intent="ghost" size="sm" routerLink="/food" routerLinkActive="btn-active">Симулятор еды</a>
    <a appButton intent="ghost" size="sm" routerLink="/shops" routerLinkActive="btn-active">Список магазинов</a>
    <a appButton intent="ghost" size="sm" routerLink="/offers" routerLinkActive="btn-active">Список предложений</a>
    <div class="flex-1"></div>
    <button appButton size="sm" (click)="reloadShopsAndUser()">Обновить</button>
  </app-navbar>
  <div class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </div>
  <footer class="shrink-0 px-4 py-1.5 text-xs text-base-content/40 border-t border-base-content/[0.06] flex justify-end">
    v{{ version }}
  </footer>
</div>

@if (loadingState()) {
  <app-loading />
}

@if (toastService.toast(); as toast) {
  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-base-300 text-base-content text-sm px-4 py-2 rounded-lg shadow-lg border border-base-content/10 z-50 animate-fade-in">
    {{ toast.message }}
  </div>
}
