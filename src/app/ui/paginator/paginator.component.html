<div class="flex">
  @for (pageData of pagesToRender(); track pageData.page) {
    <button
      appButton intent="outline" size="sm"
      [active]="pageData.page == page()"
      [disabled]="pageData.disabled"
      (click)="pageData.disabled || changePage(pageData.page)"
    >
      {{ pageData.text }}
    </button>
  }
</div>
