<h4 class="text-md text-primary">{{ shop().name }}</h4>
<div class="flex gap-4">
  <div class="w-full">
    <p class="mb-2">Продает</p>
    <table appTable zebra size="compact" class="border border-base-content/[0.06]">
      <thead>
        <tr>
          <th>Товар</th>
          <th>Цена</th>
          <th>Количество</th>
        </tr>
      </thead>
      <tbody>
        @for (offer of sellOffers(); track $index) {
          <tr [class.text-base-content/30]="offer.quantity === 0">
            <td>{{ offer.itemName }}</td>
            <td>{{ offer.price }}</td>
            <td>{{ offer.quantity }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="w-full">
    <p class="mb-2">Покупает</p>
    <table appTable zebra size="compact" class="border border-base-content/[0.06]">
      <thead>
        <tr>
          <th>Товар</th>
          <th>Цена</th>
          <th>Количество</th>
        </tr>
      </thead>
      <tbody>
        @for (offer of buyOffers(); track $index) {
          <tr [class.text-base-content/30]="offer.quantity === 0">
            <td>{{ offer.itemName }}</td>
            <td>{{ offer.price }}</td>
            <td>{{ offer.quantity }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
