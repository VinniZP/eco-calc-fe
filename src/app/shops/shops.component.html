<div class="px-4 pb-4">
  <app-card [shadow]="false">
    <span card-title>Список магазинов</span>
    <input appInput bordered type="text" placeholder="Поиск по магазину" [(ngModel)]="search" />

    <div class="rounded">
      @for (shop of shops(); track shop.id) {
        <app-shop [shop]="shop" />
        @if (!$last) {
          <app-divider />
        }
      }
    </div>
  </app-card>
</div>
