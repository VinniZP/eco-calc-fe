<div class="px-3 py-2 flex items-center gap-3 border-b border-base-content/[0.04]">
  <h2 class="text-sm font-medium text-base-content/60 shrink-0">
    Магазины
    <span class="text-base-content/30 font-normal">{{ shops().length }}</span>
  </h2>
  <div class="relative flex-1 min-w-[200px] max-w-[400px]">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-base-content/30 pointer-events-none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
    </svg>
    <input type="text" appInput size="sm" bordered placeholder="Поиск по магазину..." [value]="search()" (input)="search.set(inputValue($event))" class="!pl-9" />
  </div>
</div>
<div class="p-3 space-y-3">
  @for (shop of shops(); track shop.id) {
    <app-shop [shop]="shop" />
  }
  @empty {
    <p class="text-sm text-base-content/50 text-center py-8">Магазинов не найдено</p>
  }
</div>
